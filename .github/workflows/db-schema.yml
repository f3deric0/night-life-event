name: Database schema smoke test

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/db-schema.yml'

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nightlife_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: nightlife_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare minimal local Supabase Auth identity stubs
        run: |
          psql -v ON_ERROR_STOP=1 -c 'create schema auth; create table auth.users(id uuid primary key); create role anon nologin; create role authenticated nologin; create role service_role nologin;'
      - name: Execute Phase 1a migration against disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261104170000_core_schema.sql
      - name: Run structural and RLS regression checks
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/core_schema_smoke.sql
